<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parser Extraction Pipeline</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #12a968;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · profile-driven extraction</p>
    <h1>Coredoc parser — from repo to a queryable code graph</h1>

    <svg viewBox="0 0 1040 576" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="parser-pipe-title parser-pipe-desc">
      <title id="parser-pipe-title">Parser Extraction Pipeline</title>
      <desc id="parser-pipe-desc">Claude authors a small declarative extraction profile, a generic tree-sitter and SCIP engine applies it to the repo, and the resulting graph is served to AI agents through MCP locally, with optional cloud sharing and CI auto-sync for teams.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#12a968"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ═══ Zones ═══ -->
      <!-- Zone: local -->
      <rect x="32" y="72" width="976" height="288" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="60" y="76" width="248" height="12" rx="2" fill="#f5f5f5"/>
      <text x="184" y="85" fill="rgba(45,49,66,0.40)" font-size="7"
            font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">LOCAL · CODE NEVER LEAVES THE MACHINE</text>

      <!-- Zone: cloud -->
      <rect x="32" y="392" width="976" height="128" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="60" y="396" width="272" height="12" rx="2" fill="#f5f5f5"/>
      <text x="196" y="405" fill="rgba(45,49,66,0.40)" font-size="7"
            font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">TEAM SHARING · CLOUD SAAS OR ON-PREM</text>

      <!-- ═══ Arrows ═══ -->
      <!-- skill -> profile.ts -->
      <line x1="216" y1="136" x2="280" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- profile.ts -> engine -->
      <line x1="440" y1="136" x2="488" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- engine -> ParsedRepo -->
      <line x1="664" y1="136" x2="776" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="678" y="116" width="84" height="12" rx="2" fill="#f5f5f5"/>
      <text x="720" y="125" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">COREDOC PARSE</text>
      <!-- engine -> skill (coverage loop, dashed) -->
      <path d="M552,168 V192 Q552,200 544,200 H144 Q136,200 136,192 V168"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="294" y="208" width="92" height="12" rx="2" fill="#f5f5f5"/>
      <text x="340" y="217" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">SCORECARD ≥80%</text>
      <!-- ParsedRepo -> local graph -->
      <line x1="876" y1="168" x2="876" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="888" y="204" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="928" y="213" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">PUSH · LINK</text>
      <!-- local graph -> MCP -->
      <line x1="776" y1="292" x2="672" y2="292" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="702" y="272" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="724" y="281" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">READS</text>
      <!-- MCP -> agents -->
      <line x1="488" y1="292" x2="376" y2="292" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="404" y="272" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="432" y="281" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">14 TOOLS</text>
      <!-- ParsedRepo -> cloud workspace (push --remote) -->
      <path d="M976,136 H992 Q1000,136 1000,144 V444 Q1000,452 992,452 H688"
            fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="798" y="432" width="84" height="12" rx="2" fill="#f5f5f5"/>
      <text x="840" y="441" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">PUSH --REMOTE</text>
      <!-- CI action -> workspace -->
      <line x1="232" y1="452" x2="488" y2="452" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="334" y="432" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="360" y="441" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">CI PUSH</text>
      <!-- workspace -> agents (cloud MCP, dashed link) -->
      <path d="M488,436 H296 Q288,436 288,428 V328"
            fill="none" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>
      <rect x="358" y="416" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="392" y="425" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">CLOUD MCP</text>

      <!-- ═══ Nodes ═══ -->
      <!-- author-profile skill -->
      <rect x="56" y="104" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="56" y="104" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="64" y="110" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
      <text x="82" y="119" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SKILL</text>
      <text x="136" y="142" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">author-profile</text>
      <text x="136" y="158" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AI scouts conventions</text>

      <!-- profile.ts (focal) -->
      <rect x="280" y="104" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="280" y="104" width="160" height="64" rx="6" fill="rgba(18,169,104,0.08)" stroke="#12a968" stroke-width="1"/>
      <rect x="288" y="110" width="32" height="12" rx="2" fill="transparent" stroke="rgba(18,169,104,0.5)" stroke-width="0.8"/>
      <text x="304" y="119" fill="#0d7a4c" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FILE</text>
      <text x="360" y="142" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">profile.ts</text>
      <text x="360" y="158" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">~50 reviewable lines</text>

      <!-- Engine -->
      <rect x="488" y="104" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="488" y="104" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="496" y="110" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
      <text x="518" y="119" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENGINE</text>
      <text x="576" y="142" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Profile engine</text>
      <text x="576" y="158" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tree-sitter + SCIP</text>

      <!-- ParsedRepo -->
      <rect x="776" y="104" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="776" y="104" width="200" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="784" y="110" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.5)" stroke-width="0.8"/>
      <text x="802" y="119" fill="rgba(79,93,117,0.9)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JSON</text>
      <text x="876" y="134" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ParsedRepo</text>
      <text x="876" y="148" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">entrypoints · entities · calls</text>
      <text x="876" y="160" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">summarize · embed</text>

      <!-- Local graph -->
      <rect x="776" y="256" width="200" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="776" y="256" width="200" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="784" y="262" width="24" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.5)" stroke-width="0.8"/>
      <text x="796" y="271" fill="rgba(79,93,117,0.9)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="876" y="294" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Local graph</text>
      <text x="876" y="310" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SQLite · Ladybug · cross-repo</text>

      <!-- MCP server (focal) -->
      <rect x="488" y="256" width="184" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="488" y="256" width="184" height="72" rx="6" fill="rgba(18,169,104,0.08)" stroke="#12a968" stroke-width="1"/>
      <rect x="496" y="262" width="28" height="12" rx="2" fill="transparent" stroke="rgba(18,169,104,0.5)" stroke-width="0.8"/>
      <text x="510" y="271" fill="#0d7a4c" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MCP</text>
      <text x="580" y="288" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MCP server</text>
      <text x="580" y="304" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">discovery · explain</text>
      <text x="580" y="318" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">impact · cross-repo</text>

      <!-- Agents -->
      <rect x="200" y="256" width="176" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="200" y="256" width="176" height="72" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="208" y="262" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
      <text x="220" y="271" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AI</text>
      <text x="288" y="294" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AI agents · IDE</text>
      <text x="288" y="310" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Claude Code · Codex · CLI</text>

      <!-- CI action -->
      <rect x="56" y="416" width="176" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="56" y="416" width="176" height="72" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="64" y="422" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
      <text x="76" y="431" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CI</text>
      <text x="144" y="450" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">GitHub Action</text>
      <text x="144" y="466" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">coredoc ci run</text>
      <text x="144" y="478" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">parse · summarize · push</text>

      <!-- Cloud workspace -->
      <rect x="488" y="416" width="200" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="488" y="416" width="200" height="72" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="496" y="422" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
      <text x="514" y="431" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLOUD</text>
      <text x="588" y="450" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Team workspace</text>
      <text x="588" y="466" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">members · remote MCP</text>
      <text x="588" y="478" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SaaS Ladybug·R2 / on-prem Neo4j</text>

      <!-- ═══ Legend ═══ -->
      <line x1="32" y1="536" x2="1008" y2="536" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="112" y="546" width="16" height="12" rx="2" fill="rgba(18,169,104,0.08)" stroke="#12a968" stroke-width="1"/>
      <text x="136" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">PROFILE + MCP · THE PRODUCT EDGE</text>

      <line x1="360" y1="552" x2="400" y2="552" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="408" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">LOCAL FLOW</text>

      <line x1="512" y1="552" x2="552" y2="552" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="560" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">COVERAGE LOOP</text>

      <line x1="688" y1="552" x2="728" y2="552" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="736" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">CLOUD SYNC</text>

      <line x1="840" y1="552" x2="880" y2="552" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>
      <text x="888" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">CLOUD MCP</text>
    </svg>
  </div>
</body>
</html>
