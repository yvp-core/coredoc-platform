<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SDD Workflows + Capture</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #12a968;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · coredoc-workflows plugin</p>
    <h1>Spec-driven workflows with a content-free capture plane</h1>

    <svg viewBox="0 0 1040 576" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sdd-capture-title sdd-capture-desc">
      <title id="sdd-capture-title">SDD Workflows + Capture</title>
      <desc id="sdd-capture-desc">A task router classifies work and drives spec, plan-review, implement and review skills around a central spec.md artifact, while session hooks and native OTel logs flow through a local sanitizing relay to the Coredoc workspace without any code or prompt content.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#12a968"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ═══ Zones ═══ -->
      <!-- Zone A: SDD workflow -->
      <rect x="32" y="72" width="976" height="256" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="60" y="76" width="216" height="12" rx="2" fill="#f5f5f5"/>
      <text x="168" y="85" fill="rgba(45,49,66,0.40)" font-size="7"
            font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SDD WORKFLOW · AGENT SESSION</text>

      <!-- Zone B: capture plane -->
      <rect x="128" y="384" width="848" height="128" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="156" y="388" width="256" height="12" rx="2" fill="#f5f5f5"/>
      <text x="284" y="397" fill="rgba(45,49,66,0.40)" font-size="7"
            font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CAPTURE PLANE · FAIL-OPEN · CONTENT-FREE</text>

      <!-- ═══ Arrows ═══ -->
      <!-- router -> spec -->
      <line x1="208" y1="136" x2="256" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="212" y="116" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="232" y="125" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">ROUTE</text>
      <!-- spec -> plan-review -->
      <line x1="400" y1="136" x2="448" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- plan-review -> implement (user gate, accent) -->
      <line x1="592" y1="136" x2="640" y2="136" stroke="#12a968" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="600" y="116" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="616" y="125" fill="#0d7a4c" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">GATE</text>
      <!-- implement -> review -->
      <line x1="784" y1="136" x2="832" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- spec skill -> spec.md -->
      <path d="M328,168 V216 Q328,224 336,224 H424 Q432,224 432,232 V240"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="344" y="204" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="382" y="213" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">REDACT-SCAN</text>
      <!-- spec.md -> implement (dashed) -->
      <path d="M544,264 H664 Q672,264 672,256 V168"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="566" y="244" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="596" y="253" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">AC · SCOPE</text>
      <!-- spec.md -> review (dashed) -->
      <path d="M544,288 H892 Q900,288 900,280 V168"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="728" y="268" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="760" y="277" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">SPEC BASIS</text>
      <!-- zone A -> observer (hooks) -->
      <line x1="264" y1="328" x2="264" y2="416" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="276" y="364" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="298" y="373" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">HOOKS</text>
      <!-- zone A -> relay (native OTLP) -->
      <line x1="552" y1="328" x2="552" y2="416" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="564" y="364" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="596" y="373" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">OTLP LOGS</text>
      <!-- observer -> relay -->
      <line x1="368" y1="448" x2="464" y2="448" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="392" y="428" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="414" y="437" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">FLUSH</text>
      <!-- relay -> workspace -->
      <line x1="640" y1="448" x2="736" y2="448" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="664" y="428" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="686" y="437" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">HTTPS</text>

      <!-- ═══ Nodes ═══ -->
      <!-- Router -->
      <rect x="64" y="104" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="104" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="72" y="110" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
      <text x="94" y="119" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROUTER</text>
      <text x="136" y="142" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Task router</text>
      <text x="136" y="158" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">intent · risk · scale</text>

      <!-- coredoc-spec -->
      <rect x="256" y="104" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="256" y="104" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="264" y="110" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
      <text x="282" y="119" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SKILL</text>
      <text x="328" y="142" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">coredoc-spec</text>
      <text x="328" y="158" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">intent → spec</text>

      <!-- coredoc-plan-review -->
      <rect x="448" y="104" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="448" y="104" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="456" y="110" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
      <text x="474" y="119" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SKILL</text>
      <text x="520" y="142" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Plan review</text>
      <text x="520" y="158" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">user approval gate</text>

      <!-- coredoc-implement -->
      <rect x="640" y="104" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="640" y="104" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="648" y="110" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
      <text x="666" y="119" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SKILL</text>
      <text x="712" y="142" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Implement</text>
      <text x="712" y="158" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">subagents · verify</text>

      <!-- coredoc-review -->
      <rect x="832" y="104" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="832" y="104" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="840" y="110" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
      <text x="858" y="119" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SKILL</text>
      <text x="904" y="142" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Review</text>
      <text x="904" y="158" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">findings · read-only</text>

      <!-- spec.md (focal) -->
      <rect x="352" y="240" width="192" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="352" y="240" width="192" height="72" rx="6" fill="rgba(18,169,104,0.08)" stroke="#12a968" stroke-width="1"/>
      <rect x="360" y="246" width="32" height="12" rx="2" fill="transparent" stroke="rgba(18,169,104,0.5)" stroke-width="0.8"/>
      <text x="376" y="255" fill="#0d7a4c" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FILE</text>
      <text x="448" y="274" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">spec.md</text>
      <text x="448" y="290" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">UC · BR · AC · ADR · LIM</text>
      <text x="448" y="304" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">status: draft → accepted</text>

      <!-- Annotation between zones -->
      <text x="832" y="348" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">Bugs prepend an investigate stage;</text>
      <text x="832" y="364" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">small changes go straight to implement.</text>

      <!-- Capture hooks -->
      <rect x="160" y="416" width="208" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="160" y="416" width="208" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="168" y="422" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.5)" stroke-width="0.8"/>
      <text x="186" y="431" fill="rgba(79,93,117,0.9)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOOKS</text>
      <text x="264" y="450" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Capture hooks</text>
      <text x="264" y="466" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">workflow-observer · outbox</text>

      <!-- Managed relay -->
      <rect x="464" y="416" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="464" y="416" width="176" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="472" y="422" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.5)" stroke-width="0.8"/>
      <text x="490" y="431" fill="rgba(79,93,117,0.9)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RELAY</text>
      <text x="552" y="450" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Managed relay</text>
      <text x="552" y="466" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">127.0.0.1:43181 · sanitizer</text>

      <!-- Coredoc workspace -->
      <rect x="736" y="416" width="208" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="736" y="416" width="208" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="744" y="422" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
      <text x="762" y="431" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLOUD</text>
      <text x="840" y="450" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Coredoc workspace</text>
      <text x="840" y="466" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">otel/v1 · capture/v1 · self-hostable</text>

      <!-- ═══ Legend ═══ -->
      <line x1="32" y1="528" x2="1008" y2="528" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="548" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="112" y="538" width="16" height="12" rx="2" fill="rgba(18,169,104,0.08)" stroke="#12a968" stroke-width="1"/>
      <text x="136" y="548" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">SPEC ARTIFACT</text>

      <line x1="256" y1="544" x2="296" y2="544" stroke="#12a968" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="304" y="548" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">USER APPROVAL GATE</text>

      <line x1="480" y1="544" x2="520" y2="544" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="640" y1="544" x2="680" y2="544" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <line x1="856" y1="544" x2="896" y2="544" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

    </svg>
  </div>
</body>
</html>
