<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intent Layer — To Be</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #12a968;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Coredoc Intent Overlay</p>
    <h1>Intent layer — reviewed product truth beside the code graph</h1>

    <svg viewBox="0 0 1000 584" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="intent-tobe-title intent-tobe-desc">
      <title id="intent-tobe-title">Intent Layer — To Be</title>
      <desc id="intent-tobe-desc">Product intent is captured from finalized specs (later also mined from Jira, code and the code graph) into a git-tracked overlay file, reviewed by maintainers, anchored to code-graph nodes, and served to planning, implementation, review and investigation agents through one read-only MCP tool.</desc>

        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>

        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ═══ Zones (before arrows and nodes) ═══ -->
      <!-- Zone 1: repo-local, git-tracked -->
      <rect x="264" y="112" width="200" height="392" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="284" y="116" width="160" height="12" rx="2" fill="#f5f5f5"/>
      <text x="364" y="125" fill="rgba(45,49,66,0.40)" font-size="7"
            font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">REPO-LOCAL · GIT-TRACKED</text>

      <!-- Zone 2: coredoc local read surfaces -->
      <rect x="544" y="256" width="208" height="264" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="576" y="260" width="144" height="12" rx="2" fill="#f5f5f5"/>
      <text x="648" y="269" fill="rgba(45,49,66,0.40)" font-size="7"
            font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">COREDOC LOCAL · READ-ONLY</text>

      <!-- ═══ Arrows (before nodes) ═══ -->
      <!-- S1 Finalized spec -> Capture skill -->
      <path d="M200,128 H232 Q240,128 240,136 V160 Q240,168 248,168 H280"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <text x="408" y="267" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"

      <text x="294" y="399" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"

      <text x="432" y="399" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"

      <text x="504" y="317" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"

      <rect x="48" y="288" width="152" height="64" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>

      <text x="124" y="342" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">bootstrap mining · later</text>

      <rect x="280" y="144" width="168" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="288" y="150" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
      <text x="306" y="159" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SKILL</text>
      <text x="364" y="186" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Intent-capture skill</text>
      <text x="364" y="204" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">coredoc intent capture</text>
      <text x="364" y="220" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">validate · no auto-accept</text>

      <!-- F: intent.json (focal) -->
      <rect x="280" y="288" width="168" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="280" y="288" width="168" height="80" rx="6" fill="rgba(18,169,104,0.08)" stroke="#12a968" stroke-width="1"/>

      <text x="648" y="340" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one bounded read tool</text>
      <text x="648" y="354" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">+ coredoc intent CLI</text>

      <text x="648" y="478" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Code graph</text>
      <text x="648" y="494" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">stableId · versionedId</text>

      <!-- A: Workflow agents -->
      <rect x="800" y="280" width="160" height="96" rx="6" fill="#f5f5f5"/>

      <rect x="808" y="286" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>

      <text x="880" y="340" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">plan · implement</text>
      <text x="880" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">review · investigate</text>

      <!-- ═══ Legend ═══ -->
