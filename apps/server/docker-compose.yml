# Local development stack: Postgres, Neo4j, the server, the web app and the
# agent runner. A development harness only (source mounts, watch mode,
# hard-coded database credentials): never ship it; see ONPREM.md.
#
# Prerequisites: Docker Desktop, with "Use Rosetta for x86_64/amd64 emulation"
# on Apple Silicon (the runner is linux/amd64; under qemu Claude Code aborts
# and the runner reports sdk_unusable), and apps/server/.env filled in from
# .env.example.
#
#   cd apps/server
#   docker compose up --build           # everything; -d to detach
#   docker compose logs -f coredoc-server coredoc-web agent-runner
#
# Server http://localhost:3000, web (Vite, HMR) http://localhost:5173,
# Neo4j browser http://localhost:7474, Postgres localhost:5432.
#
# Edits under apps/server/src, apps/web/src and apps/agent-runner/src reload
# their service. Changes to packages/* (core, db, mcp), package.json or a
# Dockerfile need `docker compose up -d --build <service>`.
#
# The runner waits ("not configured") until agent-runner.env holds a runner
# token: create one in Settings → Agent runs, copy agent-runner.env.example to
# agent-runner.env, fill it in, then `docker compose up -d agent-runner`.
# Full instructions: README.md, "Local stack with Docker Compose".
services:
  coredoc-server:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
      target: build
    ports:
      - "3000:3000"
    depends_on:
      postgres-db:
        condition: service_healthy
    env_file:
      - ./.env
    # Overrides for the container network; everything else comes from .env.
    environment:
      PORT: 3000
      NODE_ENV: development
      # The worker polls its queue every few seconds; per-query logging drowns the log.
      # Set to true here to see every Prisma query.
      PRISMA_QUERY_LOG: "false"
      DATABASE_URL: postgresql://coredoc:coredoc@postgres-db:5432/coredoc
      NEO4J_URI: bolt://coredoc-parsers-neo4j:7687
      MCP_SERVER_URL: ${MCP_SERVER_URL:-http://localhost:3000}

      # Ensure TypeScript watch works reliably in Docker Desktop mounts
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
    restart: unless-stopped
    init: true
    working_dir: /app
    # prisma generate writes into the mounted src/generated (git-ignored), so a
    # checkout that never ran it on the host still compiles.
    command: >
      sh -c "pnpm --filter @coredoc/server exec prisma generate &&
             pnpm --filter @coredoc/server exec prisma migrate deploy &&
             pnpm --filter @coredoc/server exec tsc &&
             (pnpm --filter @coredoc/server exec tsc --watch --preserveWatchOutput &
              node --watch apps/server/dist/main.js)"
    volumes:
      - ../../apps/server/src:/app/apps/server/src
      - ../../apps/server/prisma:/app/apps/server/prisma:ro

  coredoc-web:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
      target: web-dev
    ports:
      - "5173:5173"
    depends_on:
      - coredoc-server
    environment:
      # apps/web/vite.config.ts proxies /api, /mcp, OAuth paths, ... here.
      SERVER_ORIGIN: http://coredoc-server:3000
      # Vite's watcher (chokidar) misses some host edits on Docker Desktop mounts.
      CHOKIDAR_USEPOLLING: "true"
    restart: unless-stopped
    init: true
    volumes:
      - ../../apps/web/src:/app/apps/web/src

  postgres-db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: coredoc
      POSTGRES_PASSWORD: coredoc
      POSTGRES_DB: coredoc
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coredoc"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Settings live in agent-runner.env (copy agent-runner.env.example; never
  # committed). Without it the runner logs what is missing and waits.
  agent-runner:
    build:
      context: ../..
      dockerfile: apps/agent-runner/Dockerfile
      target: dev
    # Claude Code and the plugin's launcher ship for linux/amd64 only. On Apple
    # Silicon, Docker Desktop must emulate amd64 with Rosetta: under qemu the
    # Claude Code binary aborts.
    platform: linux/amd64
    depends_on:
      - coredoc-server
    env_file:
      - path: ./agent-runner.env
        required: false
    environment:
      COREDOC_API_URL: http://coredoc-server:3000
      # Local development only: lets CLAUDE_CODE_OAUTH_TOKEN (your own `claude setup-token`)
      # stand in for ANTHROPIC_API_KEY. Products always use the customer's API key.
      COREDOC_RUNNER_DEV_SUBSCRIPTION: "1"
      # An idle runner claims every 30 s here instead of 5 s, to keep the logs readable.
      COREDOC_RUNNER_POLL_SECONDS: "30"
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
    volumes:
      - ../../apps/agent-runner/src:/app/apps/agent-runner/src
      - agent-runner-scratch:/scratch
    restart: unless-stopped

  coredoc-parsers-neo4j:
    container_name: coredoc-parsers-neo4j
    image: neo4j:latest
    ports:
      - 7474:7474
      - 7687:7687
    environment:
      - NEO4J_AUTH=neo4j/asd123A!
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_server_memory_heap_initial__size=4G
      - NEO4J_server_memory_heap_max__size=4G
    volumes:
      - ./data/neo4j_db/data:/data
      - ./data/neo4j_db/plugins:/plugins

volumes:
  pgdata:
  agent-runner-scratch:
