services:
  coredoc-server:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
      target: build
    ports:
      - "3000:3000"
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: development
      DATABASE_URL: postgresql://coredoc:coredoc@postgres:5432/coredoc
      MCP_SERVER_URL: http://localhost:3000

      # Ensure TypeScript watch works reliably in Docker Desktop mounts
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling

      # Self-hosted OAuth AS — upstream identity provider + access-token signing.
      OAUTH_UPSTREAM: ${OAUTH_UPSTREAM:-github}
      OAUTH_JWT_SECRET: ${OAUTH_JWT_SECRET}
      # GitHub upstream (OAUTH_UPSTREAM=github, the default)
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      # WorkOS AuthKit-as-OIDC (Connect) upstream (OAUTH_UPSTREAM=workos).
      # CLIENT_ID / CLIENT_SECRET are the Connect OAuth Application's OWN
      # credentials. WORKOS_AUTHKIT_CLIENT_ID / WORKOS_API_KEY belong to the
      # AuthKit Application that delivers and completes invitation emails.
      WORKOS_AUTHKIT_DOMAIN: ${WORKOS_AUTHKIT_DOMAIN:-}
      WORKOS_AUTHKIT_CLIENT_ID: ${WORKOS_AUTHKIT_CLIENT_ID:-}
      WORKOS_API_KEY: ${WORKOS_API_KEY:-}
      WORKOS_CLIENT_ID: ${WORKOS_CLIENT_ID:-}
      WORKOS_CLIENT_SECRET: ${WORKOS_CLIENT_SECRET:-}

      # Encryption key for Turso DB tokens at rest (64 hex chars = 32 bytes)
      SERVER_ENCRYPTION_KEY: ${SERVER_ENCRYPTION_KEY}

      # Turso — workspace database provisioning (optional for local dev)
      TURSO_ORG: ${TURSO_ORG:-}
      TURSO_ORG_TOKEN: ${TURSO_ORG_TOKEN:-}

      # R2 — parser storage (optional, falls back to in-memory)
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-coredoc-parsers}

      # Desktop release bucket for the invitation handoff download buttons
      # (optional; defaults to the hosted bucket).
      DESKTOP_RELEASES_URL: ${DESKTOP_RELEASES_URL:-}

    restart: unless-stopped
    init: true
    working_dir: /app
    command: >
      sh -c "pnpm --filter @coredoc/server exec tsc &&
             (pnpm --filter @coredoc/server exec tsc --watch --preserveWatchOutput &
              node --watch apps/server/dist/main.js)"
    volumes:
      - ../../apps/server/src:/app/apps/server/src

  postgres-db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: coredoc
      POSTGRES_PASSWORD: coredoc
      POSTGRES_DB: coredoc
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coredoc"]
      interval: 5s
      timeout: 3s
      retries: 5
  
  coredoc-parsers-neo4j:
    container_name: coredoc-parsers-neo4j
    image: neo4j:latest
    ports:
      - 7474:7474
      - 7687:7687
    environment:
      - NEO4J_AUTH=neo4j/asd123A!
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_server_memory_heap_initial__size=4G
      - NEO4J_server_memory_heap_max__size=4G
    volumes:
      - ./data/neo4j_db/data:/data
      - ./data/neo4j_db/plugins:/plugins
    
volumes:
  pgdata:
