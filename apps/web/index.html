<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coredoc Cloud</title>
    <script>
      // Pre-paint theme: an explicit choice is stamped on <html> before first
      // paint; no stored value means "system" and leaves the attribute unset.
      try {
        var t = localStorage.getItem('coredoc-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
